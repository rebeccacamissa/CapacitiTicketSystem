<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recruiter overview · CAPACITI Support</title>
  <link rel="icon" href="/assets/logo-mark.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main id="main" class="opacity-0 space-y-6" data-title="Recruiter overview" data-subtitle="Recruiter workspace">
    <section class="glass relative overflow-hidden p-6 sm:p-8">
      <div class="absolute inset-0 bg-gradient-to-br from-purple/35 via-transparent to-salmon/25"></div>
      <div class="relative max-w-2xl">
        <p class="chip !border-white/20 !text-white/80">Talent discovery</p>
        <h2 class="mt-4 text-3xl sm:text-4xl">Find talent ready to move forward.</h2>
        <p class="mt-3 text-white/65">Search by name, stream and stage. Explore published candidate profiles, verified credentials and project evidence.</p>
        <a href="/talent-board" class="btn btn-primary btn-shine mt-5">Explore talent board →</a>
      </div>
    </section>
    <section aria-label="Recruiter workspace metrics">
      <div id="recruiter-kpis" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
        <div class="skeleton h-28"></div><div class="skeleton h-28"></div><div class="skeleton h-28"></div><div class="skeleton h-28"></div>
      </div>
    </section>
    <section class="card">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div><h2 class="text-xl">Talent discovery</h2><p class="mt-1 text-sm text-white/55">Browse candidates who have chosen to share their portfolio.</p></div>
        <a href="/portfolios" class="btn btn-ghost">Browse portfolios</a>
      </div>
    </section>
  </main>
  <script type="module" src="/js/pages/recruiter.js"></script>
</body>
</html>
