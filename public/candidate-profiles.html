<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Candidate profiles · CAPACITI Support</title>
  <link rel="icon" href="/assets/logo-mark.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main id="main" class="opacity-0 space-y-6" data-title="Candidate profiles" data-subtitle="Recruiter workspace">
    <section class="grid gap-6 lg:grid-cols-[20rem_1fr]">
      <div class="card">
        <label for="profile-search" class="field-label">Find a shared profile</label>
        <input id="profile-search" class="field" type="search" placeholder="Search candidates">
        <ul id="profile-list" class="mt-4 space-y-1" role="listbox" aria-label="Published candidate profiles"></ul>
      </div>
      <div id="profile-detail" class="space-y-5"><div class="card text-sm text-white/50">Select a candidate to review their shared profile.</div></div>
    </section>
  </main>
  <script type="module" src="/js/pages/candidate-profiles.js"></script>
</body>
</html>
