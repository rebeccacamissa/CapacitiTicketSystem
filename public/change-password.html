<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set your password · CAPACITI Support</title>
  <link rel="icon" href="/assets/logo-mark.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="bg"></div>
  <main id="main" class="flex min-h-screen items-center justify-center p-5">
    <form id="pw" class="glass w-full max-w-md space-y-5 p-7 animate-fade-up sm:p-9" novalidate>
      <div id="brand"></div>
      <div>
        <p class="chip !text-warn">Temporary password</p>
        <h1 class="mt-3 text-2xl">Welcome, <span id="name" class="text-gradient"></span></h1>
        <p class="mt-1 text-sm text-white/60">Your administrator gave you a temporary password. Choose your own to continue.</p>
      </div>
      <div><label for="currentPassword" class="field-label">Temporary password</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" class="field" required><p class="field-error" data-error-for="currentPassword"></p></div>
      <div><label for="newPassword" class="field-label">New password</label><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" class="field" required><p class="mt-1 text-xs text-white/50">8+ characters with upper-case, lower-case and a number.</p><p class="field-error" data-error-for="newPassword"></p></div>
      <div><label for="confirm" class="field-label">Confirm new password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" class="field" required><p class="field-error" data-error-for="confirm"></p></div>
      <button class="btn btn-primary btn-shine w-full !py-3">Save and continue</button>
      <button type="button" id="logout" class="w-full text-center text-sm text-white/50 hover:text-white">Sign out</button>
    </form>
  </main>
  <script type="module" src="/js/pages/change-password.js"></script>
</body>
</html>
