<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Choose a new password · CAPACITI Support</title>
  <link rel="icon" href="/assets/logo-mark.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="bg"></div>
  <main id="main" class="flex min-h-screen items-center justify-center p-5">
    <form id="reset" class="glass w-full max-w-md space-y-5 p-7 animate-fade-up sm:p-9" novalidate>
      <div id="brand"></div>
      <div>
        <h1 class="text-2xl">Choose a new password</h1>
        <p class="mt-1 text-sm text-white/60">8+ characters with upper-case, lower-case and a number.</p>
      </div>
      <div><label for="newPassword" class="field-label">New password</label><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" class="field" required><p class="field-error" data-error-for="newPassword"></p></div>
      <div><label for="confirm" class="field-label">Confirm new password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" class="field" required><p class="field-error" data-error-for="confirm"></p></div>
      <button class="btn btn-primary btn-shine w-full !py-3">Save new password</button>
      <p class="text-center text-sm"><a href="/forgot-password" class="font-semibold text-salmon-50 hover:underline">Request a new link</a></p>
    </form>
  </main>
  <script type="module" src="/js/pages/reset-password.js"></script>
</body>
</html>
